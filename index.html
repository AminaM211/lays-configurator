<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lays-configurator</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <!-- BACKGROUND -->
    <div id="bg-box"></div>
    <!-- THREE.JS -->
    <div id="app"></div>

    <!-- SCROLL UI -->
    <div class="ui">
      <section class="step step-start">
        <div class="welkom">
          <h1>Design your Lays</h1>
          <p>SCROLL TO START</p>
        </div>
      </section>
      <!-- STEP 1: NAME -->
      <section class="step step-name">
        <h2>1. Give your bag a name</h2>
        <label class="h3">
          <input
            type="text"
            id="bag-name"
            maxlength="26"
            placeholder="Bag name"
          />
        </label>
      </section>

      <!-- STEP 2: COLOR -->
      <section class="step step-color">
        <h2>2. Choose a color</h2>

        <div class="colors">
          <button type="button" class="color-swatch" data-color="custom"></button>
          <input
            type="color"
            id="bag-color"
            value="#d32b2b"
            class="color-input-hidden"
            style="display: hidden;"
          />

          <button type="button" class="color-swatch is-active" data-color="#BE0003" style="--swatch-color:#BE0003"></button>
          <button type="button" class="color-swatch" data-color="#FF6F00" style="--swatch-color:#FF6F00"></button>
          <button type="button" class="color-swatch" data-color="#9100D3" style="--swatch-color:#9100D3"></button>
          <button type="button" class="color-swatch" data-color="#FF35B2" style="--swatch-color:#FF35B2"></button>
          <button type="button" class="color-swatch" data-color="#0077c8" style="--swatch-color:#0077c8"></button>
          <button type="button" class="color-swatch" data-color="#2DC925" style="--swatch-color:#2DC925"></button>
        </div>
      </section>

      <!-- STEP 4: FONT -->
      <section class="step step-font">
        <h2>4. Select a font</h2>

        <fieldset class="font-group">
          <label><input type="radio" name="bag-font" value="Helvetica" checked /> Helvetica</label>
          <label><input type="radio" name="bag-font" value="Arial" /> Arial</label>
          <label><input type="radio" name="bag-font" value="Impact" /> Impact</label>
        </fieldset>
      </section>

      <!-- STEP 5: IMAGE -->
      <section class="step step-image">
        <h2>5. Add an image</h2>
        <label class="h3">
          <input type="file" id="bag-image" accept="image/*" />
        </label>
      </section>

      <!-- STEP 6: FLAVOURS -->
      <section class="step step-flavours">
        <h2>6. Key flavours</h2>
        <label class="h3">
          <textarea id="bag-flavours" maxlength="50"></textarea>
        </label>
      </section>

      <!-- STEP 7: SAVE -->
      <section class="step step-save">
        <h2>7. Finish your design</h2>
        <div class="background-group">
          <label class="bg-label">
            <input
              type="color"
              id="bg-color"
              value="#05060a"
              class="color-input-hidden"
            />
          </label>

          <img class="bg-img-thumb" data-img="red" src="/assets/red-bg.png" />
          <img class="bg-img-thumb" data-img="blue" src="/assets/blue-bg.png" />
          <img class="bg-img-thumb" data-img="green" src="/assets/green-bg.png" />
          <img class="bg-img-thumb" data-img="pink" src="/assets/pink-bg.png" />
          <img class="bg-img-thumb" data-img="orange" src="/assets/orange-bg.png" />
          <img class="bg-img-thumb" data-img="yellow" src="/assets/yellow-bg.png" />


          <input type="file" id="bg-image" accept="image/*" />
        </div>
        <div class="button-row">
          <button id="save-config">Upload</button>
          <button id="reset-config" type="button">Try again</button>
        </div>
      </section>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
